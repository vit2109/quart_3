[project]
name = "quart-2-01"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "fastapi>=0.139.0",
    "polars>=1.42.1",
    "pydantic[email]>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-jose[cryptography]>=3.5.0",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.51.0",
    "python-multipart>=0.0.32",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=5.0.0",
    "fastexcel>=0.20.2",
    "httpx>=0.28.1",
    "huggingface-hub>=1.23.0",
    "transformers>=5.14.1",
    "torch>=2.13.0",
    "gguf>=0.19.0",
    "accelerate>=1.14.0",
    "chromadb>=1.5.9",
    "sentence-transformers>=5.6.0",
    "pypdf>=6.14.2",
    "python-docx>=1.2.0",
    "reportlab>=4.2.0",
    "apscheduler>=3.10.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
]
build = [
    "pyinstaller>=6.16.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::pytest.PytestDeprecationWarning:pytest_asyncio.plugin",
]
